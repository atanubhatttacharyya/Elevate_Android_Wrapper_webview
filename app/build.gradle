plugins {
    id 'com.android.application'
}

def releaseKeyStorePath = System.getenv('CM_KEYSTORE_PATH')
def releaseKeyStorePassword = System.getenv('CM_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('CM_KEY_ALIAS')
def releaseKeyPassword = System.getenv('CM_KEY_PASSWORD')
def releaseSigningConfigured = [
        releaseKeyStorePath,
        releaseKeyStorePassword,
        releaseKeyAlias,
        releaseKeyPassword
].every { value -> value != null && !value.trim().isEmpty() }

android {
    namespace 'com.elevate.optiontrading'
    compileSdk 35

    defaultConfig {
        applicationId 'com.elevate.optiontrading'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '2.0.1-webview'
    }

    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile file(releaseKeyStorePath)
                storePassword releaseKeyStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-auth:21.3.0'
}
