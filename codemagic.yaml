workflows:
  android-debug:
    name: Elevate Android WebView Debug APK
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      java: 17
    scripts:
      - name: Check toolchain
        script: |
          java -version
          gradle --version
      - name: Build WebView debug APK
        script: |
          gradle --no-daemon assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  android-release-unsigned:
    name: Elevate Android WebView Release Bundle (unsigned)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      java: 17
    scripts:
      - name: Build release bundle
        script: |
          gradle --no-daemon bundleRelease
    artifacts:
      - app/build/outputs/bundle/release/*.aab

  generate-release-keystore-once:
    name: Generate Elevate Release Keystore - One Time Only
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      java: 17
      groups:
        - elevate
    scripts:
      - name: Generate permanent keystore
        script: |
          set -euo pipefail
          mkdir -p "$CM_BUILD_DIR/keystore"
          keytool -genkeypair \
            -keystore "$CM_BUILD_DIR/keystore/elevate-release.jks" \
            -storetype JKS \
            -alias elevate_release_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Elevate Android Release, OU=Mobile, O=Elevate, L=Kolkata, ST=West Bengal, C=IN" \
            -storepass "$ELEVATE_KEYSTORE_PASSWORD" \
            -keypass "$ELEVATE_KEY_PASSWORD"
          keytool -list \
            -keystore "$CM_BUILD_DIR/keystore/elevate-release.jks" \
            -storepass "$ELEVATE_KEYSTORE_PASSWORD"
    artifacts:
      - keystore/elevate-release.jks
